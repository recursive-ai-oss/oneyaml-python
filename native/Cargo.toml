[package]
name = "oneyaml-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "Native backend of the oneyaml Python package"
build = "build.rs"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"] }
# The parsing engine.
oneyaml = { git = "https://github.com/recursive-ai-oss/oneyaml-rust", rev = "e24c4f8ea1cd7987f04629599148086b1d3fc105" } # pinned engine revision
oneyaml-syntax = { git = "https://github.com/recursive-ai-oss/oneyaml-rust", rev = "e24c4f8ea1cd7987f04629599148086b1d3fc105" } # event stream, same revision

[profile.dev]
# Fast to build and fast enough to test: our crate lightly optimised,
# dependencies (the parser) more so, since debug-built parsing is very slow.
opt-level = 1
incremental = true
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
