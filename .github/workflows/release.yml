name: release

# A "v*" tag builds every wheel and publishes to PyPI with Trusted Publishing (OIDC,
# no tokens). "Run workflow" builds and tests everything but never publishes.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # The tag must name the version in pyproject.toml.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the package version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "package version: $version"
          if [ "$REF_TYPE" != tag ]; then
            echo "not a tag: dry run, nothing will be published"
            exit 0
          fi
          if [ "$REF_NAME" != "v$version" ]; then
            echo "::error::tag $REF_NAME does not match package version $version"
            exit 1
          fi

  wheels:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/wheels.yml
    with:
      full: true

  # Runs only when every job above succeeded, and only for a pushed tag.
  publish:
    needs: [version, wheels]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Check the wheel set
        run: |
          ls -l dist
          # 4 linux + 2 macOS + 1 Windows platforms with 6 interpreters each, plus the pure wheel.
          test "$(find dist -name '*-cp*.whl' | wc -l | tr -d ' ')" = 42
          test "$(find dist -name '*-py3-none-any.whl' | wc -l | tr -d ' ')" = 1
          test "$(find dist -type f | wc -l | tr -d ' ')" = 43
      - uses: pypa/gh-action-pypi-publish@aef6c9b6e301dc803e1bc9133e9ce67ae9b0906b # v1.14.3
        with:
          packages-dir: dist
