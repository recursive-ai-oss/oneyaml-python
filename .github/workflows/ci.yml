name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  UV_PYTHON_PREFERENCE: only-managed

defaults:
  run:
    shell: bash

jobs:
  # Formatting, static analysis and the public-repository guards.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.13'
      - name: Dev tools
        run: |
          uv venv -q .venv
          uv pip install -q --python .venv --group dev
      - name: ruff
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: cargo fmt
        run: cargo fmt --check
        working-directory: native
      - name: cargo clippy
        run: cargo clippy --profile dev -- -D warnings
        working-directory: native
      - name: Pushed range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          # A pull request checks base..head. A push checks before..after, or the
          # whole history for a new branch or a before commit that is gone.
          range=HEAD
          if [ "$EVENT" = pull_request ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && [ -n "${BEFORE//0/}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$PUSH_SHA"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "checking $range"
      - name: Public-text patterns
        env:
          PATTERNS: ${{ secrets.PUBLICTEXT_PATTERNS }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: |
          # The patterns are not in the repository. Without the secret the next
          # steps fail on purpose rather than pass unchecked, with one exception: a
          # pull request from a fork gets no secrets, so there the private patterns
          # are skipped with a notice and only the generic checks run.
          if [ -n "$PATTERNS" ]; then
            f="$RUNNER_TEMP/publictext-patterns.txt"
            printf '%s\n' "$PATTERNS" > "$f"
            echo "PUBLICTEXT_PATTERNS=$f" >> "$GITHUB_ENV"
          elif [ "$FORK_PR" = true ]; then
            echo "PUBLICTEXT_ALLOW_MISSING=true" >> "$GITHUB_ENV"
            echo "::notice::Pull request from a fork: the private public-text patterns are not available, so only the generic checks ran. A maintainer runs the full check."
          else
            echo "::error::The PUBLICTEXT_PATTERNS secret is not available"
          fi
      - name: Public text, whole tree
        run: python tools/publictext.py --tree
      - name: Public text, commit messages
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: python tools/publictext.py --commits "$RANGE"
      - name: Secret scan
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: python tools/secretscan.py --range "$RANGE"

  # The suite on both backends. While the repository is private only three
  # interpreters run; once it is public the whole list does, with no edit here.
  # "native: false" runs the pure backend alone (no native wheel for that interpreter).
  # The timeout is far above the slowest healthy job, so a hang fails in minutes, not hours.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event.repository.private && '[{"python":"3.10","native":true},{"python":"3.13","native":true},{"python":"3.14t","native":true}]' || '[{"python":"3.10","native":true},{"python":"3.11","native":true},{"python":"3.12","native":true},{"python":"3.13","native":true},{"python":"3.14","native":true},{"python":"3.14t","native":true},{"python":"3.15","native":true,"experimental":true},{"python":"pypy3.11","native":false}]') }}
    name: test (${{ matrix.python }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Environment
        run: |
          uv venv -q -p "${{ matrix.python }}" .venv
          uv pip install -q --python .venv --group dev
      - name: Install (native build)
        if: matrix.native
        run: |
          .venv/bin/maturin build -q --profile dev -o wheels -i .venv/bin/python
          uv pip install -q --python .venv --no-deps wheels/*.whl
      - name: Install (pure wheel)
        if: ${{ !matrix.native }}
        run: |
          .venv/bin/python tools/build_pure.py wheels
          uv pip install -q --python .venv --no-deps wheels/*.whl
      # Both steps include the slow-marked stress tests that the local gate leaves out.
      - name: Tests, native backend
        if: matrix.native
        run: ONEYAML_BACKEND=native .venv/bin/python -m pytest -q -n auto -m "slow or not slow"
      - name: Tests, pure backend
        env:
          ONEYAML_TEST_BACKENDS: ${{ matrix.native && 'native,pure' || 'pure' }}
        run: ONEYAML_BACKEND=pure .venv/bin/python -m pytest -q -n auto -m "slow or not slow"

  # Release-profile wheels: linux x86_64 for every interpreter plus the pure wheel, each
  # installed into a fresh environment and tested. The other platforms build in release.yml.
  wheels:
    permissions:
      contents: read
    uses: ./.github/workflows/wheels.yml
    with:
      full: false
