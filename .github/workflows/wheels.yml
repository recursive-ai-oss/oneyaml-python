name: wheels

# Builds the release wheels and tests each one: a native wheel for every supported
# interpreter on every platform, plus the pure-Python wheel. Called by ci.yml (one
# platform, to keep pull requests quick) and by release.yml (everything).
#
# Native wheels are per interpreter, not abi3: free-threaded CPython has no stable ABI.
# PyPy gets the pure wheel. Every wheel is installed into a fresh environment and run
# through a test subset on both backends (tools/check_wheel.py).

on:
  workflow_call:
    inputs:
      full:
        description: Build every platform instead of linux x86_64 only
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  UV_PYTHON_PREFERENCE: only-managed
  # One list for every platform: the interpreters a native wheel is built for.
  PYTHONS: '3.10 3.11 3.12 3.13 3.14 3.14t'

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          FULL: ${{ inputs.full }}
        run: |
          linux_x86='{"name":"linux-x86_64","runner":"ubuntu-latest","kind":"linux","target":"x86_64-unknown-linux-gnu","compat":"manylinux_2_28","image":"quay.io/pypa/manylinux_2_28_x86_64"}'
          all="$linux_x86"
          all+=',{"name":"linux-aarch64","runner":"ubuntu-24.04-arm","kind":"linux","target":"aarch64-unknown-linux-gnu","compat":"manylinux_2_28","image":"quay.io/pypa/manylinux_2_28_aarch64"}'
          all+=',{"name":"musllinux-x86_64","runner":"ubuntu-latest","kind":"linux","target":"x86_64-unknown-linux-musl","compat":"musllinux_1_2","image":"quay.io/pypa/musllinux_1_2_x86_64"}'
          all+=',{"name":"musllinux-aarch64","runner":"ubuntu-24.04-arm","kind":"linux","target":"aarch64-unknown-linux-musl","compat":"musllinux_1_2","image":"quay.io/pypa/musllinux_1_2_aarch64"}'
          all+=',{"name":"macos-x86_64","runner":"macos-15-intel","kind":"uv","target":"x86_64-apple-darwin","deployment":"10.13"}'
          all+=',{"name":"macos-arm64","runner":"macos-latest","kind":"uv","target":"aarch64-apple-darwin","deployment":"11.0"}'
          all+=',{"name":"windows-x64","runner":"windows-latest","kind":"uv","target":"x86_64-pc-windows-msvc"}'
          if [ "$FULL" = true ]; then
            echo "matrix={\"include\":[$all]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$linux_x86]}" >> "$GITHUB_OUTPUT"
          fi

  native:
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: native (${{ matrix.name }})
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ---- Linux: build in the manylinux / musllinux container, test in the same image.
      # The image carries every interpreter under /opt/python. The path prefixes keep
      # the workspace and cargo directories out of the compiled module.
      - name: Build (linux)
        if: matrix.kind == 'linux'
        uses: PyO3/maturin-action@3e2bdf6ba6453a61e649744019b8a2d906c7eb38 # v1.51.0
        env:
          RUSTFLAGS: >-
            --remap-path-prefix=${{ github.workspace }}=/src
            --remap-path-prefix=/root/.cargo=/cargo
            --remap-path-prefix=/root/.rustup=/rustup
            --remap-path-prefix=/usr/local/cargo=/cargo
            --remap-path-prefix=/usr/local/rustup=/rustup
            --remap-path-prefix=${{ runner.temp }}=/tmp
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.compat }}
          docker-options: -e RUSTFLAGS
          args: >-
            --release --out dist
            -i /opt/python/cp310-cp310/bin/python
            -i /opt/python/cp311-cp311/bin/python
            -i /opt/python/cp312-cp312/bin/python
            -i /opt/python/cp313-cp313/bin/python
            -i /opt/python/cp314-cp314/bin/python
            -i /opt/python/cp314-cp314t/bin/python

      # ---- macOS and Windows: interpreters from uv, build on the runner.
      - name: Interpreters (macOS, Windows)
        if: matrix.kind == 'uv'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.13'
      - name: Find interpreters (macOS, Windows)
        if: matrix.kind == 'uv'
        id: find
        run: |
          # shellcheck disable=SC2086
          uv python install $PYTHONS
          list=""
          for v in $PYTHONS; do list="$list -i $(uv python find "$v")"; done
          echo "args=$list" >> "$GITHUB_OUTPUT"
      - name: Build (macOS, Windows)
        if: matrix.kind == 'uv'
        uses: PyO3/maturin-action@3e2bdf6ba6453a61e649744019b8a2d906c7eb38 # v1.51.0
        env:
          RUSTFLAGS: >-
            ${{ runner.os == 'Windows' && '-C link-arg=/PDBALTPATH:%_PDB%' || '' }}
            --remap-path-prefix=${{ github.workspace }}=/src
            --remap-path-prefix=${{ runner.temp }}=/tmp
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          args: --release --out dist ${{ steps.find.outputs.args }}

      - name: Check the wheel set
        run: |
          ls -l dist
          test "$(find dist -name '*-cp*.whl' | wc -l)" = 6

      # ---- Install each wheel in a fresh environment and run the subset.
      - name: Test (linux)
        if: matrix.kind == 'linux'
        run: |
          docker run --rm -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD:/w:ro" -w /w "${{ matrix.image }}" bash -ec '
            /opt/python/cp313-cp313/bin/pip install -q auditwheel
            for w in dist/*-cp*.whl; do
              b=$(basename "$w"); py=$(echo "$b" | cut -d- -f3); abi=$(echo "$b" | cut -d- -f4)
              echo "::group::$b"
              /opt/python/cp313-cp313/bin/auditwheel show "$w"
              /opt/python/$py-$abi/bin/python tools/check_wheel.py "$w" /opt/python/$py-$abi/bin/python
              echo "::endgroup::"
            done'
      - name: Test (macOS, Windows)
        if: matrix.kind == 'uv'
        run: |
          for w in dist/*-cp*.whl; do
            b=$(basename "$w"); abi=$(echo "$b" | cut -d- -f4)
            py=$(uv python find "3.${abi#cp3}")
            echo "::group::$b"
            "$py" tools/check_wheel.py "$w" "$py"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  # The pure wheel is built once. It installs anywhere, so it is tested on the oldest
  # and newest CPython and on PyPy.
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.13'
      - name: Build
        run: |
          python tools/build_pure.py dist
          ls -l dist
          test "$(find dist -name '*-py3-none-any.whl' | wc -l)" = 1
      - name: Test
        run: |
          for v in 3.10 3.13 pypy3.11; do
            uv python install "$v"
            py=$(uv python find "$v")
            echo "::group::$v"
            "$py" tools/check_wheel.py dist/*-py3-none-any.whl "$py"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-pure
          path: dist/*.whl
          if-no-files-found: error
